name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published version to validate without replacing its assets'
        required: true
        default: 'v0.7.1'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.44.2'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > app/android/app/release-keystore.jks
    
    - name: Create key.properties
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cat > app/android/key.properties << EOF
        storePassword=$KEYSTORE_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=release-keystore.jks
        EOF
    
    - name: Install dependencies
      run: |
        cd app
        flutter pub get

    - name: Check release tag matches package version
      run: |
        PACKAGE_VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)
        test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"

    - name: Analyze and test Flutter
      working-directory: app
      run: |
        flutter analyze --no-pub
        flutter test --no-pub

    - name: Test backend without production services
      working-directory: server
      run: |
        python -m pip install -r requirements-test.txt
        python -m unittest discover -s tests -v
    
    - name: Install iOS dependencies
      if: github.event_name == 'push'
      run: |
        cd app/ios
        pod install
    
    - name: Build Android APK
      run: |
        cd app
        flutter build apk --release
    
    - name: Build iOS IPA (unsigned)
      if: github.event_name == 'push'
      run: |
        cd app
        flutter build ios --release --no-codesign
    
    - name: Create IPA from build
      if: github.event_name == 'push'
      run: |
        cd app/build/ios/iphoneos
        mkdir -p Payload
        mv Runner.app Payload/
        zip -r ../../../kaoqin-helper-unsigned.ipa Payload
        cd ../../..
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${RELEASE_TAG}" >> $GITHUB_OUTPUT
    
    - name: Rename APK
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        cp app/build/app/outputs/flutter-apk/app-release.apk app/kaoqin-helper-${VERSION}.apk
    
    # A locally verified signed release must not be replaced by a later CI build.
    # Unsigned iOS output is build validation only, not an installable public release.
    - name: Publish Android APK if release does not already exist
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.get_version.outputs.VERSION }}
      run: |
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "Release already exists; preserving its verified assets and notes."
        else
          gh release create "$TAG" "app/kaoqin-helper-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "考勤助手 ${TAG}" --generate-notes
        fi
